# develop에 머지되면 테스트 → api 이미지 빌드·ECR 푸시 → 서버에서 deploy.sh 실행 (web은 그대로)
# 배포 대상 정보(역할, 서버, 저장소)는 레포 Secrets에 있고, 로그에는 *** 로 가려짐
name: Deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

# 배포가 겹치면 앞의 배포가 끝난 뒤 실행 (중간에 취소하지 않음)
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # AWS OIDC 임시 자격 증명용

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      redis:
        image: redis:8
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: 테스트
        run: ./gradlew test --no-daemon

      - name: AWS 임시 자격 증명 받기 (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true

      - name: 이미지 빌드, ECR 푸시
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          TAG="${GITHUB_SHA::7}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACCOUNT_ID"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY" > /dev/null 2>&1 \
            || { echo "ECR 로그인 실패 (역할의 ECR 권한 확인)"; exit 1; }
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          docker build --pull --platform linux/amd64 -t "$IMAGE" .
          echo "Java 버전: $(docker run --rm --entrypoint java "$IMAGE" -version 2>&1 | head -1)"
          docker push --quiet "$IMAGE" > /dev/null
          docker logout "$REGISTRY" > /dev/null
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: 서버 배포 (api만 교체)
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          CMD_ID=$(aws ssm send-command \
            --document-name PICON-Deploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "{\"apiTag\":[\"$TAG\"],\"webTag\":[\"-\"]}" \
            --comment "backend $TAG" \
            --query Command.CommandId --output text)
          echo "배포 시작: api=$TAG"

          # 최대 15분 대기 (다른 배포 대기 5분 + 배포 3분 + 실패 시 되돌리기 3분)
          STATUS=Pending
          for _ in $(seq 1 90); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done

          echo "----- 서버 출력 -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          if [ "$STATUS" != "Success" ]; then
            echo "----- 서버 오류 출력 -----"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text || true
          fi
          echo "---------------------"
          echo "결과: $STATUS"
          [ "$STATUS" = "Success" ]