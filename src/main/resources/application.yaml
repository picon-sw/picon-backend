spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  claude:
    review-summary:
      base-url: https://api.anthropic.com
      api-key: ${ANTHROPIC_API_KEY:}
      model: claude-haiku-5-5
      api-version: "2026-10-21"
      max-tokens: 256
      connect-timeout: 3s
      read-timeout: 30s
      prompt: ${CLAUDE_REVIEW_SUMMARY_PROMPT:}
  s3:
    fake-image-url: ${S3_FAKE_IMAGE_URL:false}
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:}
    presigned-url-expiration: 10m
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 30m
    refresh-token-expiration: 14d
    session-expiration: 30d
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    allowed-redirect-uris: ${KAKAO_REDIRECT_URIS}
  swagger:
    username: ${SWAGGER_USERNAME:}
    password: ${SWAGGER_PASSWORD:}

server:
  port: 8080

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/swagger-ui.html
